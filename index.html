<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnold von Engelbrechten</title>
<meta name="description" content="Arnold von Engelbrechten — researcher in international relations theory and political philosophy. London, England.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234d0a05'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --link: #0645ad;
    --maroon: #4d0a05;
  }
  html[data-theme="dark"] {
    --bg: #141413;
    --ink: #e6e4df;
    --muted: #9a9a94;
    --link: #8ab4f8;
    --maroon: #660c07;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", "URW Palladio L", Georgia, serif;
    font-size: 1.08rem;
    line-height: 1.65;
    transition: background 0.35s ease, color 0.35s ease;
  }
  main {
    max-width: 36rem;
    margin: 0 0 0 clamp(0rem, 7vw, 6rem);   /* left-justified, but eased off the edge */
    padding: 5rem 1.5rem 6rem 2.5rem;
    position: relative;
  }
  @media (max-width: 480px) {
    main { padding-left: 1.25rem; padding-right: 1.25rem; }
  }

  /* --- square + name --- */
  .mast {
    position: relative;
    font-size: clamp(0.95rem, 5.4vw, 1.82rem);
    font-weight: 400;
    margin: 0 0 2rem;
    line-height: 1.2;
    white-space: nowrap;
  }
  .square {
    position: absolute;    /* home base: on top of the name's first letters */
    left: 0;
    top: 50%;
    margin-top: -0.675em;  /* vertically centred without using transform */
    width: 1.35em;
    height: 1.35em;
    z-index: 1;
    cursor: pointer;
    touch-action: manipulation;
    will-change: transform;
  }
  .shape {
    filter: blur(0.2px);   /* the nudge: softens the shape's edges */
    display: block;
    width: 100%;
    height: 100%;
    background: #4d0a05;   /* set & cycled by script thereafter */
    will-change: transform;
    transition: background 0.35s ease;
  }
  .name {
    display: inline-block;
    overflow: hidden;            /* the reveal window */
    vertical-align: bottom;
    will-change: transform;
    transform: translateX(-100%);     /* window parked left: nothing visible */
  }
  .name-text {
    display: inline-block;
    will-change: transform;
    transform: translateX(100%);      /* counter-shift keeps glyphs in place */
  }

  .bio { opacity: 0; transition: opacity 0.6s ease; }
  .bio.show { opacity: 1; }

  p { margin: 0 0 1.1rem; }
  a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  .links { color: var(--muted); margin-top: 2.5rem; }
  .links .sq {
    display: inline-block;
    width: 0.42em;
    height: 0.42em;
    background: var(--maroon);
    margin: 0 0.6em;
    vertical-align: middle;
    transition: background 0.35s ease;
  }

  /* --- theme toggle --- */
  .theme-toggle {
    touch-action: manipulation;
    position: fixed;         /* centred on the page itself, not the column */
    top: 1.25rem;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: none;
    padding: 0.5rem;
    cursor: pointer;
    color: var(--muted);
    line-height: 0;
  }
  .theme-toggle:hover { color: var(--ink); }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .moon { display: none; }
  html[data-theme="dark"] .theme-toggle .sun { display: none; }
  html[data-theme="dark"] .theme-toggle .moon { display: inline; }

  @media (prefers-reduced-motion: reduce) {
    .name, .name-text { transform: none !important; }
    .bio { opacity: 1 !important; transition: none; }
  }
</style>
</head>
<body>
<main>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2.5" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="21.5"/>
        <line x1="2.5" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="21.5" y2="12"/>
        <line x1="5.3" y1="5.3" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="18.7" y2="18.7"/>
        <line x1="5.3" y1="18.7" x2="7" y2="17"/>
        <line x1="17" y1="7" x2="18.7" y2="5.3"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>

  <h1 class="mast">
    <span class="square" id="square" title="spin me"><span class="shape" id="shape"></span></span>
    <span class="name" id="name"><span class="name-text" id="nameText">Arnold von Engelbrechten</span></span>
  </h1>

  <div class="bio" id="bio">
    <p>I am a researcher working on international relations theory and
    political philosophy. Currently based in London, England.</p>

    <p class="links">
      <a href="/writing">writing</a><span class="sq"></span><a href="https://substack.com/@engelbrechten">substack</a><span class="sq"></span><a href="#" id="mail">email</a>
    </p>
  </div>

</main>

<script>
  // ---- controls ----
  var SLIDE_MS   = 500;   // opening slide duration
  var LOAD_DELAY = 400;   // ms after page open before it moves
  var ROLL_DEG   = 90;    // roll during the opening slide
  var ROLL_SPAN  = [0.04, 0.96];
  var SPIN_MS    = 400;   // hover/click spin duration
  var SPIN_DEG   = 90;    // one fold per interaction
  // ------------------

  var square = document.getElementById('square');
  var shape  = document.getElementById('shape');
  var name_  = document.getElementById('name');
  var nameText = document.getElementById('nameText');
  var bio    = document.getElementById('bio');
  var toggle = document.getElementById('themeToggle');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ease = 'cubic-bezier(0.65, 0, 0.35, 1)';

  // colour cycle: red -> green -> blue (channel rotations of #4D0A05)
  var COLORS = [
    { light: '#4d0a05', dark: '#660c07' },
    { light: '#054d0a', dark: '#07660c' },
    { light: '#0a054d', dark: '#0d0766' }
  ];
  var colorIndex = 0;
  function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function cval(i) { return isDark() ? COLORS[i].dark : COLORS[i].light; }

  // --- theme toggle ---
  try {
    if (localStorage.getItem('theme') === 'dark')
      document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
  toggle.addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'dark');
    try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
    shape.style.backgroundColor = cval(colorIndex);
  });

  // --- the one-time opening reveal: square slides across, name appears, stays ---
  var angle = 0;          // accumulated rotation of the shape
  var spinning = false;

  function reveal() {
    if (reduced) {
      name_.style.transform = 'none';
      nameText.style.transform = 'none';
      bio.classList.add('show');
      return;
    }
    var mastFont = parseFloat(getComputedStyle(name_.parentElement).fontSize) || 24;
    var gap = 0.55 * mastFont;
    var W = square.offsetWidth, N = nameText.offsetWidth;
    var d = N + gap;                                  // rest just past the name
    var maxD = name_.parentElement.clientWidth - W;   // keep it on screen
    if (maxD > 0 && d > maxD) d = maxD;
    var p1 = Math.min(1, N / d);

    square.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(' + d + 'px)' }],
      { duration: SLIDE_MS, easing: ease, fill: 'forwards' }
    );
    shape.animate(
      [
        { transform: 'rotate(0deg)', offset: 0 },
        { transform: 'rotate(0deg)', offset: ROLL_SPAN[0] },
        { transform: 'rotate(' + ROLL_DEG + 'deg)', offset: ROLL_SPAN[1] },
        { transform: 'rotate(' + ROLL_DEG + 'deg)', offset: 1 }
      ],
      { duration: SLIDE_MS, easing: ease, fill: 'forwards' }
    );
    angle = ROLL_DEG;

    // GPU reveal: sliding window + counter-slid text, glyphs appear fixed
    name_.animate(
      [
        { transform: 'translateX(' + (-N) + 'px)', offset: 0 },
        { transform: 'translateX(0)', offset: p1 },
        { transform: 'translateX(0)', offset: 1 }
      ],
      { duration: SLIDE_MS, easing: ease, fill: 'forwards' }
    );
    nameText.animate(
      [
        { transform: 'translateX(' + N + 'px)', offset: 0 },
        { transform: 'translateX(0)', offset: p1 },
        { transform: 'translateX(0)', offset: 1 }
      ],
      { duration: SLIDE_MS, easing: ease, fill: 'forwards' }
    ).onfinish = function () {
      bio.classList.add('show');
    };
  }

  // --- hover or click: spin in place and shift to the next colour ---
  function spin() {
    if (spinning || reduced) return;
    spinning = true;
    var from = angle, to = angle + SPIN_DEG;
    angle = to;
    var cFrom = cval(colorIndex);
    colorIndex = (colorIndex + 1) % COLORS.length;
    var cTo = cval(colorIndex);
    shape.style.backgroundColor = cTo;   // final value persists
    shape.animate(
      [
        { transform: 'rotate(' + from + 'deg)', backgroundColor: cFrom },
        { transform: 'rotate(' + to + 'deg)',   backgroundColor: cTo }
      ],
      { duration: SPIN_MS, easing: ease, fill: 'forwards' }
    ).onfinish = function () { spinning = false; };
  }

  window.addEventListener('load', function () {
    setTimeout(reveal, LOAD_DELAY);
  });
  square.addEventListener('mouseenter', spin);
  square.addEventListener('click', spin);

  // email assembled at runtime: invisible to HTML-scraping bots
  (function () {
    var m = document.getElementById('mail');
    var addr = ['arnold', 'engelbrechten', 'com'];
    m.href = 'mailto:' + addr[0] + '@' + addr[1] + '.' + addr[2];
  })();
</script>
</body>
</html>
